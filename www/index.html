<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#143766">

    <meta
        name="description"
        content="Tap the worms before time runs out in Robin Whack-A-Worm!"
    >

    <meta name="mobile-web-app-capable" content="yes">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Robin Whack"
    >

    <link rel="manifest" href="manifest.json">

    <link
        rel="apple-touch-icon"
        href="assets/icon-192.png"
    >

    <link rel="stylesheet" href="style.css">

    <title>Robin Whack-A-Worm</title>

</head>
<body>

  <div id="game">

    <div id="particles"></div>

    <div id="startScreen">
        <h1>🐦 Robin Whack-A-Worm</h1>

        <p>Tap the worms to catch them!</p>

        <div class="highScore">
            🏆 Best Score:
            <span id="highScoreValue">0</span>
        </div>

        <div class="instructions">
            💥 <b>Tap Worms</b> to catch them!<br><br>
            🪱 Normal Pink Worm = 1 Pt<br>
            ⚡ Blue Worm = 2 Pts (Fast!)<br>
            ⭐ Golden Worm = Rare! (+5s Time)
        </div>

        <button id="startBtn" onclick="startGame()">Start Game</button>
    </div>

    <div id="snow"></div>

    <div id="hud">
      <div id="score">⭐ <span id="scoreValue">0</span></div>
      <div id="combo" class="comboDisplay"></div>
      <div id="timer">⏱ 60</div>
    </div>

    <div id="holes"></div>

    <img id="robin"
         src="./assets/robbin.png"
         draggable="false">

    <div id="ground"></div>

    <div id="gameOver">

        <div class="gameOverRobin">🐦</div>

        <h2>Time's Up!</h2>

        <p class="finalScoreLabel">Your Score</p>

        <div class="finalScore">
            <span id="finalScore">0</span>
            <span class="scoreStar">⭐</span>
        </div>

        <div id="newHighScore" class="newHighScore">
            🏆 NEW HIGH SCORE!
        </div>

        <div class="scoreStats">

            <div class="scoreStat">
                <span>🏆</span>
                <small>Best</small>
                <strong id="finalHighScore">0</strong>
            </div>

            <div class="scoreStat">
                <span>🔥</span>
                <small>Best Combo</small>
                <strong id="finalCombo">0</strong>
            </div>

            <div class="scoreStat">
                <span>📈</span>
                <small>Level</small>
                <strong id="finalLevel">1</strong>
            </div>

        </div>

        <button onclick="restartGame()">
            Play Again
        </button>

    </div>

  </div>

  <script src="game.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker
                .register("./sw.js")
                .catch(error => {
                    console.error("Service worker registration failed:", error);
                });
        });
    }
  </script>
</body>
</html>
