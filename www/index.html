<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#143766">

  <title>Robin Whack-A-Worm</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game">

    <div id="startScreen">
      <h1>🐦 Robin Whack-A-Worm</h1>
      <p>Tap the worms to catch them!</p>

      <div class="instructions">
        💥 <b>Tap Worms</b> to catch them!<br><br>
        🪱 Normal Pink Worm = 1 Pt<br>
        ⚡ Blue Worm = 2 Pts (Fast!)<br>
        ⭐ Golden Worm = Rare! (+5s Time)
      </div>

      <button id="startBtn" onclick="startGame()">Start Game</button>
    </div>

    <div id="snow"></div>

    <div id="hud">
      <div id="score">⭐ <span id="scoreValue">0</span></div>
      <div id="timer">⏱ 60</div>
    </div>

    <div id="holes"></div>

    <img id="robin"
         src="assets/Robbin.png"
         draggable="false">

    <div id="ground"></div>

    <div id="gameOver">
      <h2>🐦 Time's Up!</h2>
      <p style="margin: 15px 0;">Score: <span id="finalScore">0</span> ⭐</p>
      <button onclick="restartGame()">Play Again</button>
    </div>

  </div>

  <script src="game.js"></script>
</body>
</html>
